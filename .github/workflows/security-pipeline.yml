name: Security Pipeline

on:
  push:
    branches: [dev, uat, main]
  pull_request:
    branches: [dev, uat, main]

env:
  APP_IMAGE: sample-app:${{ github.run_number }}
  REPORT_DIR: security-reports

jobs:

  # ── 1. Gitleaks – all branches ─────────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --config .gitleaks.toml --report-format json --report-path gitleaks-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  # ── 2. Semgrep – all branches ──────────────────────────────────────────────
  semgrep:
    name: Semgrep
    runs-on: ubuntu-22.04
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          mkdir -p ${{ env.REPORT_DIR }}
          semgrep scan \
            --config .semgrep.yml \
            --config p/owasp-top-ten \
            --config p/secrets \
            --json \
            --output ${{ env.REPORT_DIR }}/semgrep-report.json \
            . || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-report
          path: ${{ env.REPORT_DIR }}/semgrep-report.json

  # ── 3. SonarQube – uat and main only ──────────────────────────────────────
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dproject.settings=sonarqube/sonar-project.properties

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── 4. Dependency-Check – uat and main only ────────────────────────────────
  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: cicd-security-poc
          path: .
          format: JSON HTML
          args: --failOnCVSS 7 --enableRetired

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

  # ── 5 & 6. Build → Trivy → ZAP – uat and main only ───────────────────────
  container-scan-and-dast:
    name: Build + Trivy + ZAP
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/uat' || github.ref == 'refs/heads/main'
    needs: [gitleaks, semgrep, sonarqube, dependency-check]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.APP_IMAGE }} ./sample-app

      # ── 5. Trivy ────────────────────────────────────────────────────────────
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.APP_IMAGE }}
          format: json
          output: trivy-report.json
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

      # ── 6. OWASP ZAP ────────────────────────────────────────────────────────
      - name: Start sample app
        run: |
          docker run -d --name sample-app -p 5000:5000 ${{ env.APP_IMAGE }}
          sleep 5

      - name: Run OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:5000
          rules_file_name: owasp-zap/zap-baseline.conf
          issue_title: ZAP Baseline Scan
          fail_action: false
          allow_issue_writing: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

      - name: Stop sample app
        if: always()
        run: docker rm -f sample-app || true

  # ── 7. Deploy dev – dev branch only ───────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/dev'
    needs: [gitleaks, semgrep]
    steps:
      - name: Deploy to Dev
        run: echo "✅ Dev gates passed — deploying ${{ env.APP_IMAGE }} to dev"
        # Add your dev deploy commands here

  # ── 8. Deploy uat – uat branch only ───────────────────────────────────────
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/uat'
    needs: [container-scan-and-dast]
    environment: uat
    steps:
      - name: Deploy to UAT
        run: echo "✅ All gates passed — deploying ${{ env.APP_IMAGE }} to UAT"
        # Add your UAT deploy commands here

  # ── 9. Deploy production – main branch only ───────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    needs: [container-scan-and-dast]
    environment: production
    steps:
      - name: Deploy to Production
        run: echo "✅ All gates passed — deploying ${{ env.APP_IMAGE }} to production"
        # Add your production deploy commands here
